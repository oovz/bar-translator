name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Browser builds
        run: pnpm build:all

      - name: Validate Firefox package
        run: pnpm exec web-ext lint --source-dir .output/firefox-mv3 --no-input --no-config-discovery

      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium firefox

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Chromium browser tests
        id: browser
        run: pnpm test:e2e

      - name: Upload Chromium test reports
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Firefox browser tests
        id: firefox
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        # Selenium Manager downloads these exact Mozilla releases. Browser proxy
        # preferences apply at launch; Manager downloads run outside the browser.
        # https://www.selenium.dev/documentation/selenium_manager/#configuration
        env:
          SE_FIREFOX_VERSION: '158.0.1'
          SE_GECKODRIVER_VERSION: '0.37.1'
          SE_FORCE_BROWSER_DOWNLOAD: 'true'
          SE_SKIP_BROWSER_IN_PATH: 'true'
          SE_SKIP_DRIVER_IN_PATH: 'true'
          SE_AVOID_STATS: 'true'
          SE_CACHE_PATH: ${{ runner.temp }}/selenium
        run: pnpm test:e2e:firefox

      - name: Upload Firefox failure reports
        if: failure() && steps.firefox.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-failure-reports
          path: test-results/firefox/
          retention-days: 7
