name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check tag matches extension version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag must match package.json version')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Chrome extension
        run: pnpm zip

      - name: Sign Chrome extension
        env:
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
        run: |
          if [[ -z "$CHROME_EXTENSION_PRIVATE_KEY" ]]; then
            echo '::error::Set the CHROME_EXTENSION_PRIVATE_KEY Actions secret to the PEM signing key.'
            exit 1
          fi
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/chrome-extension-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$CHROME_EXTENSION_PRIVATE_KEY" > "$key_file"
          unset CHROME_EXTENSION_PRIVATE_KEY
          google-chrome --headless --no-sandbox --no-message-box \
            --user-data-dir="$RUNNER_TEMP/chrome-pack-profile" \
            --pack-extension="$PWD/.output/chrome-mv3" \
            --pack-extension-key="$key_file"
          test -s .output/chrome-mv3.crx
          mv .output/chrome-mv3.crx ".output/bar-translator-${GITHUB_REF_NAME#v}-chrome.crx"

      - name: Collect release commits
        run: |
          if previous_tag=$(git describe --tags --abbrev=0 --exclude="$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME" 2>/dev/null); then
            range="refs/tags/$previous_tag..refs/tags/$GITHUB_REF_NAME"
          else
            range="refs/tags/$GITHUB_REF_NAME"
          fi
          {
            echo '## Commits'
            echo
            git log --format='- %s (%h)' "$range"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".output/bar-translator-${GITHUB_REF_NAME#v}-chrome.zip" \
            ".output/bar-translator-${GITHUB_REF_NAME#v}-chrome.crx" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
